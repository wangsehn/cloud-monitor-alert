# Grafana 数据源自动配置：容器启动时自动注册 Prometheus 数据源，
# 无需登录页面手动添加。数据源名为 "Prometheus"。
apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    # 显式 uid：dashboard JSON 通过该 uid 引用数据源，保证任何环境加载结果一致
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: 15s
