# ============================================================
# 云主机监控告警实验环境
# 组件: Prometheus / Grafana / Alertmanager / Node Exporter / Nginx(+exporter)
# 用法: cp .env.example .env && docker compose up -d
# 说明: 结构参考 durrello/prometheus-grafana-docker (MIT)，在此基础上做了修改：
#       1) node-exporter 增加宿主机文件系统挂载（见下方注释）
#       2) 增加 Grafana 数据源自动 provisioning（grafana/provisioning/）
#       3) 增加 --web.enable-lifecycle，支持不重启热加载告警规则
#       4) 镜像固定具体版本（不用 latest，避免无意升级引入不兼容）
#       5) 页面端口仅绑定 127.0.0.1，exporter 不映射宿主机端口（默认仅本机可访问）
#       6) Grafana 匿名访问默认关闭（GF_ANONYMOUS，见 .env.example）
# ============================================================

services:
  # ---------- 时序数据库 + 告警规则评估 ----------
  prometheus:
    image: prom/prometheus:v3.15.0
    container_name: prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      # 开启 lifecycle API 后，修改规则文件可热重载:
      #   curl -X POST http://localhost:9090/-/reload
      - '--web.enable-lifecycle'
    ports:
      # 仅绑定本机回环地址，局域网不可访问；如需局域网演示改为 "9090:9090"
      - "127.0.0.1:9090:9090"
    networks:
      - monitor-net
    restart: unless-stopped

  # ---------- 告警接收/分组/抑制 ----------
  alertmanager:
    image: prom/alertmanager:v0.34.1
    container_name: alertmanager
    volumes:
      - ./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      # 仅绑定本机回环地址（该服务无鉴权，暴露到局域网有风险）
      - "127.0.0.1:9093:9093"
    networks:
      - monitor-net
    restart: unless-stopped

  # ---------- 可视化面板 ----------
  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      # 匿名访问默认关闭；本地想免登录看面板/截图时，在 .env 设 GF_ANONYMOUS=true
      - GF_AUTH_ANONYMOUS_ENABLED=${GF_ANONYMOUS:-false}
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
    volumes:
      - grafana-data:/var/lib/grafana
      # 自动创建 Prometheus 数据源，无需在页面手动添加
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      # 仅绑定本机回环地址；如需局域网访问改为 "3000:3000"（务必同时设置强密码）
      - "127.0.0.1:3000:3000"
    depends_on:
      - prometheus
    networks:
      - monitor-net
    restart: unless-stopped

  # ---------- 主机指标采集（CPU/内存/磁盘/网络） ----------
  # 修改点: 原仓库未挂载宿主机 / 、/proc、/sys，导致磁盘等指标采集不到真实宿主机数据。
  # 挂载后 node-exporter 通过 --path.rootfs=/host 读取宿主机文件系统。
  # 注意: 在 Windows Docker Desktop 下这里读到的是 Docker 虚拟机(WSL2)的指标，
  #       部署到 Linux 服务器时才是真正的宿主机指标。
  # 不映射宿主机端口: Prometheus 通过容器网络抓取 nodeexporter:9100，无需对外暴露
  nodeexporter:
    image: prom/node-exporter:v1.12.1
    container_name: nodeexporter
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
    volumes:
      - '/:/host:ro'
      - '/proc:/host/proc:ro'
      - '/sys:/host/sys:ro'
    networks:
      - monitor-net
    restart: unless-stopped

  # ---------- 模拟"业务服务"：一个 Nginx 静态站点 ----------
  nginx:
    image: nginx:1.29.8
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./html-app:/usr/share/nginx/html:ro
    ports:
      # 宿主机端口可通过 .env 的 NGINX_PORT 覆盖（默认 8080），仅绑定本机回环地址
      - "127.0.0.1:${NGINX_PORT:-8080}:80"
    networks:
      - monitor-net
    restart: unless-stopped

  # ---------- Nginx 指标导出器（连接数/请求量） ----------
  # 不映射宿主机端口: Prometheus 通过容器网络抓取 nginxexporter:9113，无需对外暴露
  nginxexporter:
    image: nginx/nginx-prometheus-exporter:1.5.0
    container_name: nginxexporter
    command: '--nginx.scrape-uri=http://nginx:80/stub_status'
    depends_on:
      - nginx
    networks:
      - monitor-net
    restart: unless-stopped

volumes:
  grafana-data:
  prometheus-data:

networks:
  monitor-net:
    driver: bridge
