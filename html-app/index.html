<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>业务演示站点</title>
    <style>
        body { font-family: "Microsoft YaHei", sans-serif; background: #f4f6f8; text-align: center; padding-top: 12vh; }
        .card { display: inline-block; background: #fff; padding: 48px 64px; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.08); }
        h1 { color: #1a73e8; margin: 0 0 12px; }
        p { color: #555; }
    </style>
</head>
<body>
    <div class="card">
        <h1>业务演示站点运行正常</h1>
        <p>本页面由 Nginx 容器提供，用于演示"业务服务"的监控与告警。</p>
        <p>停止 nginx 容器即可模拟业务中断，观察 Prometheus 告警与恢复过程。</p>
    </div>
</body>
</html>
