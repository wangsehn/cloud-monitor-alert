# 模拟业务站点的 Nginx 配置：
# / 提供静态页面；/stub_status 暴露连接数指标供 nginx-exporter 抓取。
events {}

http {
    server {
        listen 80;

        # 业务静态页面
        location / {
            root /usr/share/nginx/html;
            index index.html;
        }

        # stub_status 指标端点，仅允许 Docker 内网网段访问，
        # 避免把内部指标暴露到宿主机公网
        location /stub_status {
            stub_status on;
            access_log off;
            allow 172.16.0.0/12;
            allow 192.168.0.0/16;
            allow 10.0.0.0/8;
            deny all;
        }
    }
}
